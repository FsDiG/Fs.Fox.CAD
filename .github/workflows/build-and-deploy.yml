name: 构建检查

on:
  push:
    branches:
      - main
      - '**' # 监听所有分支以支持 [build] 标签
  pull_request:
    branches:
      - main
      - refactor/cad-modules
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否执行部署操作'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build All Targets
    runs-on: self-hosted
    # main、长期重构分支的 PR、包含 [build]/[deploy] 的推送或手动触发
    if: |
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'main' ||
      github.base_ref == 'refactor/cad-modules' ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[deploy]') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Test TypeDef sequence comparer
        run: pwsh -NoProfile -File tools/verification/Test-CADSharedTypeDefSequence.ps1

      - name: Verify CADShared module map
        run: pwsh -NoProfile -File Build/Verify-CADSharedModuleMap.ps1

      - name: Build all (Debug & Release)
        run: |
          $buildRoot = "${{ github.workspace }}\Build"
          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null

          function Build-MSBuild([string]$csproj, [string]$prefix) {
            Write-Host "Building $prefix - Debug..."
            msbuild $csproj '/t:Restore;Build' `
              /p:OutputPath="..\..\Build\${prefix}_Debug\" `
              /p:Configuration=Debug /p:Platform="Any CPU" /verbosity:minimal
            if ($LASTEXITCODE -ne 0) {
              throw "$prefix Debug build failed with exit code ${LASTEXITCODE}."
            }
            
            Write-Host "Building $prefix - Release..."
            msbuild $csproj '/t:Restore;Build' `
              /p:OutputPath="..\..\Build\${prefix}_Release\" `
              /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
            if ($LASTEXITCODE -ne 0) {
              throw "$prefix Release build failed with exit code ${LASTEXITCODE}."
            }
            
            Write-Host "$prefix builds completed."
          }

          function Build-DotNet([string]$csproj, [string]$prefix) {
            Write-Host "Building $prefix - Debug..."
            dotnet build $csproj --configuration Debug
            if ($LASTEXITCODE -ne 0) {
              throw "$prefix Debug build failed with exit code ${LASTEXITCODE}."
            }
            
            Write-Host "Building $prefix - Release..."
            dotnet build $csproj --configuration Release
            if ($LASTEXITCODE -ne 0) {
              throw "$prefix Release build failed with exit code ${LASTEXITCODE}."
            }
            
            Write-Host "$prefix builds completed."
          }

          function Build-MSBuildWithProjectOutput([string]$csproj, [string]$name) {
            foreach ($configuration in @('Debug', 'Release')) {
              Write-Host "Building $name - $configuration..."
              msbuild $csproj '/t:Restore;Build' `
                /p:Configuration=$configuration /p:Platform="Any CPU" /verbosity:minimal
              if ($LASTEXITCODE -ne 0) {
                throw "$name $configuration build failed with exit code ${LASTEXITCODE}."
              }
            }

            Write-Host "$name builds completed."
          }

          # AutoCAD2019 - MSBuild (.NET Framework)
          Build-MSBuild "tests/TestAcad2019/TestAcad2019.csproj" "AC_2019"

          # Independent AutoCAD 2019 diagnostics plug-in (.NET Framework)
          Build-MSBuildWithProjectOutput `
            "tools/CadDiagnostics/Fs.Fox.CAD.Diagnostics.AutoCad2019/Fs.Fox.CAD.Diagnostics.AutoCad2019.csproj" `
            "CadDiagnostics AutoCAD 2019"

          # AutoCAD2025 - dotnet CLI (.NET8)
          Build-DotNet "tests/TestAcad2025/TestAcad2025.csproj" "AC_2025"

          # Independent AutoCAD 2025 diagnostics plug-in (.NET 8)
          Build-DotNet `
            "tools/CadDiagnostics/Fs.Fox.CAD.Diagnostics.AutoCad2025/Fs.Fox.CAD.Diagnostics.AutoCad2025.csproj" `
            "CadDiagnostics AutoCAD 2025"

          # ZWCAD2022 - MSBuild (.NET Framework)
          Build-MSBuild "tests/TestZcad2022/TestZcad2022.csproj" "ZW_2022"

          # ZWCAD2025 - MSBuild (.NET Framework)
          Build-MSBuild "tests/TestZcad2025/TestZcad2025.csproj" "ZW_2025"

          # GStarCAD 2022 - MSBuild (.NET Framework 4.8)
          Build-MSBuild "tests/TestGcad2022/TestGcad2022.csproj" "GC_2022"

          # GStarCAD 2023 - MSBuild (.NET Framework 4.8)
          Build-MSBuild "tests/TestGcad2023/TestGcad2023.csproj" "GC_2023"

          # GStarCAD 2026 - dotnet CLI (.NET 8)
          Build-DotNet "tests/TestGcad2026/TestGcad2026.csproj" "GC_2026"

      - name: Verify CADShared compatibility baseline
        run: pwsh -NoProfile -File Build/Verify-CADSharedCompatibility.ps1

      - name: Verify CadDiagnostics migration and outputs
        run: |
          pwsh -NoProfile -File tools/CadDiagnostics/Verify-CadDiagnostics.ps1 -Configuration Debug
          pwsh -NoProfile -File tools/CadDiagnostics/Verify-CadDiagnostics.ps1 -Configuration Release
